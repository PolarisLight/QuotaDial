[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tokio = { version = "1.53.1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync", "time", "test-util"] }
thiserror = "2.0.19"
chrono = "0.4.45"
async-trait = "0.1.91"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.20.0", features = ["v4"] }
blake3 = "1.8.5"
dirs = "6.0.0"
notify = "8.2.0"

[dev-dependencies]
tempfile = "3.27.0"

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">QuotaDial — account quota, Token usage, and equivalent cost</title>
  <desc id="desc">A technical product title with QuotaDial's hexagonal dial and a descending remaining-quota trace.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173B32"/>
      <stop offset="1" stop-color="#0D2721"/>
    </linearGradient>
    <clipPath id="chart-clip">
      <rect x="790" y="79" width="326" height="226" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="390" rx="28" fill="url(#surface)"/>
  <path d="M0 330H1200" stroke="#35584E" stroke-width="1"/>
  <path d="M704 0V390" stroke="#35584E" stroke-width="1"/>

  <g transform="translate(62 54)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
